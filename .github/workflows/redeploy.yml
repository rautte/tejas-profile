# .github/workflows/redeploy.yml

name: Redeploy (Owner)


on:
  workflow_dispatch:
    inputs:

      gitSha:
        description: "Exact 40-character main commit SHA to redeploy"
        required: true
        type: string

      confirm:
        description: "Type REDEPLOY-PROD to confirm the production rollback/redeploy"
        required: true
        type: string

      checkpointTag:
        description: "Immutable checkpoint tag, if known"
        required: false
        default: ""
        type: string

      sourceSnapshotKey:
        description: "Snapshot key that led to this redeploy, if applicable"
        required: false
        default: ""
        type: string

      reason:
        description: "Reason for redeploy"
        required: false
        default: "owner redeploy"
        type: string


permissions:
  contents: read
  pages: write
  id-token: write


jobs:

  redeploy:
    name: Redeploy exact PROD release

    uses: ./.github/workflows/deploy.yml

    with:
      gitSha: ${{ inputs.gitSha }}

      confirm: ${{ inputs.confirm }}

      releaseMode: redeploy

      checkpointTag: ${{ inputs.checkpointTag }}

      sourceSnapshotKey: ${{ inputs.sourceSnapshotKey }}

      reason: ${{ inputs.reason }}

    secrets: inherit
